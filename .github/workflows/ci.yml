name: ci
on:
  push:
    branches: [main, master, launch-polish]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: ruff check ksmcp tests
      - run: pytest -q
        env:
          KEYSCOUT_VAULT_PASS: ci-test-passphrase
  sdk-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp<2" cryptography keyring pytest
      - run: pytest -q
        env:
          KEYSCOUT_VAULT_PASS: ci-test-passphrase
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx --from dist/*.whl ksmcp quickstart
      - name: server.json valid against registry schema
        run: |
          pip install jsonschema
          curl -sSfL "$(python -c 'import json;print(json.load(open("server.json"))["$schema"])')" -o /tmp/schema.json
          python -c 'import json,jsonschema;jsonschema.validate(json.load(open("server.json")),json.load(open("/tmp/schema.json")))'
